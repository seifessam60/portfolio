<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Seif Essam | Full-Stack Developer Portfolio</title>

    <!-- Description for SEO -->
    <meta
      name="description"
      content="Portfolio of Seif Essam, a Full-Stack Developer specializing in React, Next.js, and Node.js. Building scalable web & mobile applications with modern technologies."
    />

    <!-- Keywords (optional, less important for Google but useful for other engines) -->
    <meta
      name="keywords"
      content="Seif Essam, Full-Stack Developer, React, Next.js, Node.js, Portfolio, Web Development, Software Engineer"
    />

    <!-- Author -->
    <meta name="author" content="Seif Essam" />

    <!-- Open Graph (for social sharing) -->
    <meta property="og:title" content="Seif Essam | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Explore the portfolio of Seif Essam, a Full-Stack Developer creating scalable and responsive web applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta
      property="og:image"
      content="https://yourdomain.com/images/preview.jpg"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seif Essam | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Seif Essam, Full-Stack Developer specializing in React, Next.js, and Node.js."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/images/preview.jpg"
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
